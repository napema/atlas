    sub: F.tipo === "out" ? F.sub : null,
    rif: (F.tipo === "rimb" || F.tipo === "reso") ? F.rif : null,
    ecc: F.tipo === "out" ? !!ecc : false,
    data: $("fData").value,
    ts: edit ? edit.ts : Date.now(),
    up: Date.now()
  };
  if(F.tipo === "out" && F.manual && rec.nota) learn(rec.nota, rec.cat, rec.sub);
  if(edit) DB.movs = DB.movs.map(m => m.id === edit.id ? rec : m);
  else DB.movs.push(rec);
  save(); markDirty();
  cur = rec.data.slice(0,7);
  hideSheets(); render();
  toast(edit ? "Movimento aggiornato" : rec.tipo === "extra" ? "Sforamento registrato"
    : rec.ecc ? "Salvato come straordinario, fuori dal budget" : "Salvato nel registro");
}
function deleteMov(){
  if(!edit) return;
  if(!confirm("Eliminare questo movimento?")) return;
  const now = Date.now();
  DB.movs = DB.movs.map(m =>
    m.id === edit.id ? { id:m.id, del:true, up:now, data:m.data, ts:m.ts } :
    m.rif === edit.id ? { ...m, rif:null, up:now } : m);
  save(); markDirty(); hideSheets(); render(); toast("Eliminato");
}

/* =================================================================
   IMPOSTAZIONI
   ================================================================= */
function refreshQuadra(root, p){
  const box = root.querySelector(".quadra"); if(!box) return;
  const tot = Object.values(p.b).reduce((s,v) => s + (Number(v)||0), 0);
  const diff = (Number(DB.config.entrate)||0) - tot;
  const totEl = root.querySelector("[data-tot]");
  if(totEl) totEl.textContent = tot.toLocaleString("it-IT") + " €";
  box.className = "quadra " + (diff < 0 ? "ko" : "ok");
  box.innerHTML = `<div class="rowline"><span>${diff < 0 ? "Sfori le entrate di" : "Ti resta"}</span><b class="num">${Math.abs(diff).toLocaleString("it-IT")} €</b></div>
    <div class="sub3">${diff < 0 ? "Il budget non quadra: taglia qualche pocket finché non rientri." : diff === 0 ? "Budget allocato al centesimo." : "Margine non allocato: puoi destinarlo a risparmio o accantonamenti."}</div>`;
}
function refreshSide(){ $("sideHome").innerHTML = renderSide(); bindView(); }
function renderSettings(root){
  const pk = profKeyFor(cur);
  const p = DB.profili[pk];
  let html = `<div class="sectitle" style="margin-top:8px">Profilo ${esc(p.nome)} — pocket mensili (€)</div>`;
  for(const c of DB.cats){
    html += `<div class="setrow"><span class="name">${esc(c.nome)}</span>
      <label style="display:flex; align-items:center; gap:6px; font-size:15px; color:var(--ink2)">cassa
        <input type="checkbox" data-cassacat="${c.id}" ${p.cassaCats.includes(c.id) ? "checked" : ""}></label>
      <input type="number" inputmode="numeric" data-bud="${c.id}" value="${p.b[c.id] ?? 0}"></div>`;
  }
  const totPocket = Object.values(p.b).reduce((s,v) => s + (Number(v)||0), 0);
  const entrate = Number(DB.config.entrate)||0;
  const diff = entrate - totPocket;
  html += `<div class="setrow"><span class="name">Entrate mensili attese</span><input type="number" inputmode="numeric" data-casa="entrate" value="${DB.config.entrate}"></div>`;
  html += `<div class="setrow" style="border-bottom:0"><span class="name">Totale pocket</span><span data-tot class="num" style="font-weight:700">${totPocket.toLocaleString("it-IT")} €</span></div>`;
  html += `<div class="quadra ${diff < 0 ? "ko" : "ok"}">
    <div class="rowline"><span>${diff < 0 ? "Sfori le entrate di" : "Ti resta"}</span><b class="num">${Math.abs(diff).toLocaleString("it-IT")} €</b></div>
    <div class="sub3">${diff < 0 ? "Il budget non quadra: taglia qualche pocket finché non rientri." : diff === 0 ? "Budget allocato al centesimo." : "Margine non allocato: puoi destinarlo a risparmio o accantonamenti."}</div>
  </div>`;
  html += `<div class="setrow"><span class="name">Cassa settimanale</span><input type="number" inputmode="numeric" data-conf="cassa" value="${p.cassa}"></div>`;
  html += `<div class="setrow"><span class="name">Finestra cassa (giorni del mese)</span>
    <input type="number" inputmode="numeric" data-conf="dal" value="${p.dal}" style="width:64px">
    <input type="number" inputmode="numeric" data-conf="al" value="${p.al}" style="width:64px"></div>`;
  html += `<div class="sectitle">Regola del costo casa (€)</div>
    <div class="setrow"><span class="name">Base risparmio</span><input type="number" inputmode="numeric" data-casa="casaBase" value="${DB.config.casaBase}"></div>
    <div class="setrow"><span class="name">Affitto mensile</span><input type="number" inputmode="numeric" data-casa="affitto" value="${DB.config.affitto}"></div>`;
  html += `<div class="sectitle">Sottocategorie</div><div class="sub2" style="margin-bottom:6px">Tocca una categoria per gestirle.</div>
    <div class="chips wrap">${DB.cats.map(c => `<button class="chip" data-subcat="${c.id}">${esc(c.nome)}</button>`).join("")}</div>
    <div id="subEditor"></div>`;
  html += `<div class="sectitle">Sync GitHub</div>
    <div class="sub2">${CFG.token
      ? `Configurato su ${esc(CFG.owner)}/${esc(CFG.repo)} · ${esc(CFG.path)} — token caricato.`
      : `Token NON caricato. Se config.js sul repo è già compilato, quasi sicuramente stai vedendo una copia in cache: usa «Svuota cache e ricarica» qui sotto.`}</div>
    <button class="mini" id="btnSyncNow">Sincronizza ora</button>
    <button class="mini" id="btnPurge">Svuota cache e ricarica</button>
    <div class="sub2" style="margin-top:8px">Build ${APP_V} · i movimenti restano al sicuro in locale e su GitHub.</div>`;
  html += `<div class="sectitle">Import estratto conto</div>
    <div class="sub2">CSV Revolut (TOPUP → extra, refund → reso, pocket → giro; DECLINED e non-EUR scartati), CSV italiani con punto e virgola, oppure righe incollate tipo «27/07 Barbiere 15,00» (+ davanti = entrata). I doppioni vengono riconosciuti e scartati; la categoria si assegna da sola dalle note.</div>
    <button class="mini" id="impFileBtn">Carica CSV</button>
    <input type="file" id="impFile" accept=".csv,text/csv,text/plain" style="display:none">
    <textarea id="impPaste" placeholder="…oppure incolla qui le righe dell'estratto" style="width:100%; margin-top:10px; background:var(--press); border:0; border-radius:12px; padding:12px; min-height:84px; outline:none; font:inherit; color:inherit; resize:vertical"></textarea>
    <button class="mini" id="impParse">Analizza</button>
    <div id="impPrev"></div>`;
  html += `<div class="sectitle">Dati</div>
    <button class="mini" id="btnExport">Esporta JSON</button>
    <button class="mini" id="btnImport">Importa JSON</button>
    <input type="file" id="fileImport" accept="application/json" style="display:none">`;
  root.innerHTML = html;

  root.querySelectorAll("[data-bud]").forEach(inp => inp.addEventListener("change", () => {
    p.b[inp.dataset.bud] = Math.max(0, Number(inp.value)||0); touchMeta(); save(); markDirty();
    refreshSide(); refreshQuadra(root, p);
  }));
  root.querySelectorAll("[data-cassacat]").forEach(inp => inp.addEventListener("change", () => {
    const id = inp.dataset.cassacat;
    p.cassaCats = inp.checked ? [...new Set([...p.cassaCats, id])] : p.cassaCats.filter(x => x !== id);
    touchMeta(); save(); markDirty(); refreshSide();
  }));
  root.querySelectorAll("[data-conf]").forEach(inp => inp.addEventListener("change", () => {
    p[inp.dataset.conf] = Math.max(inp.dataset.conf === "cassa" ? 0 : 1, Number(inp.value)||0); touchMeta(); save(); markDirty(); refreshSide();
  }));
  root.querySelectorAll("[data-casa]").forEach(inp => inp.addEventListener("change", () => {
    DB.config[inp.dataset.casa] = Math.max(0, Number(inp.value)||0); touchMeta(); save(); markDirty();
    refreshSide(); refreshQuadra(root, p);
  }));
  root.querySelectorAll("[data-subcat]").forEach(b => b.addEventListener("click", () => renderSubEditor(b.dataset.subcat)));
  root.querySelector("#impFileBtn").addEventListener("click", () => root.querySelector("#impFile").click());
  root.querySelector("#impFile").addEventListener("change", e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { buildImport(r.result); renderImportPreview(root); };
    r.readAsText(f);
    e.target.value = "";
  });
  root.querySelector("#impParse").addEventListener("click", () => {
    buildImport(root.querySelector("#impPaste").value);
    renderImportPreview(root);
  });
  if(IMPORT.items.length) renderImportPreview(root);
  $("btnSyncNow").addEventListener("click", () => { syncNow(); toast(CFG.token ? "Sincronizzo…" : "Configura prima config.js"); });
  $("btnPurge").addEventListener("click", async () => {
    toast("Svuoto la cache…");
    try{
      if("serviceWorker" in navigator){
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      if(window.caches){
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    }catch(e){}
    location.reload();
  });
  $("btnExport").addEventListener("click", doExport);
  $("btnImport").addEventListener("click", () => $("fileImport").click());
  $("fileImport").addEventListener("change", doImport);
}
function renderImportPreview(root){
  const box = root.querySelector("#impPrev");
  if(!IMPORT.items.length){
    box.innerHTML = `<div class="sub2" style="margin-top:10px">Nessuna riga riconosciuta.</div>`;
    return;
  }
  const dups = IMPORT.items.filter(i => i.dup).length;
  const noCat = IMPORT.items.filter(i => i.inc && !i.dup && i.tipo === "out" && !i.cat).length;
  const selN = () => IMPORT.items.filter(i => i.inc && !i.dup).length;
  const catOpts = sel => `<option value="">— categoria —</option>` +
    DB.cats.map(c => `<option value="${c.id}" ${c.id === sel ? "selected" : ""}>${esc(c.nome)}</option>`).join("");
  let html = `<div class="sub2" style="margin-top:12px"><b>${IMPORT.items.length} righe</b>${dups ? ` · ${dups} doppioni scartati` : ""}${noCat ? ` · <span style="color:var(--amber)">${noCat} senza categoria: assegnala tu</span>` : " · categorie tutte assegnate"}</div>`;
  IMPORT.items.forEach((it, i) => {
    const badge = { out:"USCITA", in:"ENTRATA", extra:"EXTRA", reso:"RESO", giro:"GIRO", rimb:"RIMB" }[it.tipo];
    const bcol = it.tipo === "extra" ? "var(--red)" : it.tipo === "in" ? "var(--green)" : "var(--ink2)";
    html += `<div class="setrow" style="${it.dup ? "opacity:.45" : ""}">
      <input type="checkbox" data-impi="${i}" ${it.inc && !it.dup ? "checked" : ""} ${it.dup ? "disabled" : ""}>
      <div style="flex:1; min-width:0">
        <div style="font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${esc(it.nota)}</div>
        <div style="font-size:15px; color:var(--ink2); margin-top:2px">${it.data} · <b style="color:${bcol}">${badge}</b>${it.dup ? " · già presente" : it.tipo === "out" && it.auto ? ` · <span style="color:var(--green)">auto${it.sub ? ": " + esc(it.sub) : ""}</span>` : ""}</div>
        ${it.tipo === "out" && !it.dup ? `<select data-impcat="${i}" style="margin-top:5px; width:100%; background:var(--press); border:0; border-radius:9px; padding:7px 9px; font:inherit; color:inherit">${catOpts(it.cat)}</select>` : ""}
      </div>
      <div class="num" style="font-weight:700; flex:none">${it.tipo === "in" ? "+" : it.tipo === "giro" ? "" : "−"}${eur(it.imp)}</div>
    </div>`;
  });
  html += `<button class="mini" id="impGo" style="background:var(--green); color:#fff">Importa selezionati (${selN()})</button>`;
  box.innerHTML = html;
  box.querySelectorAll("[data-impi]").forEach(cb => cb.addEventListener("change", () => {
    IMPORT.items[Number(cb.dataset.impi)].inc = cb.checked;
    box.querySelector("#impGo").textContent = `Importa selezionati (${selN()})`;
  }));
  box.querySelectorAll("[data-impcat]").forEach(sel => sel.addEventListener("change", () => {
    const it = IMPORT.items[Number(sel.dataset.impcat)];
    it.cat = sel.value || null; it.sub = null; it.auto = false;
  }));
  box.querySelector("#impGo").addEventListener("click", () => {
    const miss = IMPORT.items.filter(i => i.inc && !i.dup && i.tipo === "out" && !i.cat).length;
    if(miss){ toast(miss + (miss === 1 ? " uscita è" : " uscite sono") + " senza categoria"); return; }
    const n = doImportRows();
    toast(n ? "Importati " + n + " movimenti" : "Niente da importare");
    render();
  });
}
function renderSubEditor(cid){
  const c = catById(cid); if(!c) return;
  const box = $("subEditor");
  box.innerHTML = `<div class="sectitle" style="margin-top:14px">${esc(c.nome)}</div>` +
    c.sub.map((s,i) => `<div class="setrow"><input type="text" value="${esc(s)}" data-i="${i}"><button class="del" data-i="${i}" aria-label="Elimina">×</button></div>`).join("") +
    `<button class="mini" id="subAdd">Aggiungi sottocategoria</button>`;
  box.querySelectorAll("input[type=text]").forEach(inp => inp.addEventListener("change", () => {
    const v = inp.value.trim();
    if(v) c.sub[Number(inp.dataset.i)] = v;
    touchMeta(); save(); markDirty(); renderSubEditor(cid); refreshSide();
  }));
  box.querySelectorAll(".del").forEach(b => b.addEventListener("click", () => {
    c.sub.splice(Number(b.dataset.i), 1);
    touchMeta(); save(); markDirty(); renderSubEditor(cid); refreshSide();
  }));
  box.querySelector("#subAdd").addEventListener("click", () => {
    const v = prompt("Nome della nuova sottocategoria di " + c.nome);
    if(v && v.trim()){ c.sub.push(v.trim()); touchMeta(); save(); markDirty(); renderSubEditor(cid); refreshSide(); }
  });
}
function doExport(){
  const blob = new Blob([JSON.stringify(payload(), null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "registro-" + todayISO() + ".json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Registro esportato");
}
function doImport(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.movs)) throw 0;
      const flat = d.meta ? { movs:d.movs, cats:d.meta.cats, profili:d.meta.profili, rules:d.meta.rules, config:d.meta.config, metaUp:d.meta.up } : d;
      DB = normalize(flat); save(); markDirty(); hideSheets(); render();
      toast("Importati " + LIVE().length + " movimenti");
    }catch(err){ toast("File non valido"); }
  };
  r.readAsText(f);
  e.target.value = "";
}

/* =================================================================
   SHEETS + EVENTI
   ================================================================= */
function showSheet(id){ $("backdrop").classList.add("show"); $(id).classList.add("show"); }
function hideSheets(){
  $("backdrop").classList.remove("show");
  document.querySelectorAll(".sheet").forEach(s => s.classList.remove("show"));
  edit = null;
  if(SYNC.pendingRender) setTimeout(() => { if(!uiBusy()) render(); }, 60);
}
$("mPrev").addEventListener("click", () => { cur = shiftMonth(cur, -1); render(); });
$("mNext").addEventListener("click", () => { cur = shiftMonth(cur, +1); render(); });
$("seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  tab = b.dataset.tab; render();
});
document.querySelectorAll("[data-act]").forEach(b =>
  b.addEventListener("click", () => openMov(null, b.dataset.act)));
$("fData").addEventListener("input", syncSave);
$("fImp").addEventListener("input", onImpInput);
$("fImp").addEventListener("beforeinput", e => {
  if(e.data && /[^0-9.,]/.test(e.data)) e.preventDefault();
});
$("fImp").addEventListener("keydown", e => {
  if(e.metaKey || e.ctrlKey || e.key.length > 1) return;
  if(!/[0-9.,]/.test(e.key)) e.preventDefault();
});
$("fImp").addEventListener("paste", e => {
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData("text");
  $("fImp").value = sanitizeAmount(t, true);
  syncSave();
});
$("fImp").addEventListener("blur", () => {
  const v = $("fImp").value;
  if(v && v.endsWith(",")) $("fImp").value = v.slice(0,-1);   // "12," → "12"
  syncSave();
});
$("fNota").addEventListener("input", onNotaInput);
$("movSave").addEventListener("click", () => saveMov(false));
$("saveOrd").addEventListener("click", () => saveMov(false));
$("saveEcc").addEventListener("click", () => saveMov(true));
$("movCancel").addEventListener("click", hideSheets);
$("movDelete").addEventListener("click", deleteMov);
$("backdrop").addEventListener("click", hideSheets);
$("btnSettings").addEventListener("click", () => { tab = "set"; render(); });
$("catClose").addEventListener("click", hideSheets);
$("viewClose").addEventListener("click", hideSheets);
$("viewEdit").addEventListener("click", () => {
  const m = LIVE().find(x => x.id === viewId);
  hideSheets();
  if(m) setTimeout(() => openMov(m), 140);
});
document.addEventListener("keydown", e => { if(e.key === "Escape") hideSheets(); });
window.addEventListener("resize", () => render());
window.addEventListener("focus", () => syncNow());

buildKeypad();
render();
setSync(CFG.token ? "ok" : "");
if(CFG.token){ syncNow(); }
SYNC.timer = setInterval(syncNow, 20000);
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
