<!DOCTYPE html>
<html lang="it" data-tema="auto">
<head>
<meta charset="utf-8">
<!-- `maximum-scale` e `user-scalable` bloccano lo zoom su Android; Safari li
     ignora, e lì lo chiudono `touch-action` in app.css e i `gesture*` in
     main.ts. Servono tutti e tre. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>ATLAS</title>
<meta name="description" content="Finanze, pasti, corpo e abitudini in una sola app.">

<link rel="manifest" href="./manifest.webmanifest">
<!-- IL COLORE DELLA CORNICE DI SISTEMA: la barra del titolo di una PWA su
     Windows, la barra di stato su Android, la striscia sotto il notch.

     Questi due valgono per il PRIMO disegno, prima che il JavaScript parta:
     sono `--scena-fondo` dei due temi, copiato a mano. Appena la app e'
     viva, `lib/core/tema.ts` scrive un terzo tag leggendo il token vero —
     cosi' il giorno che il fondo cambia non resta una barra del colore di
     prima, che e' esattamente quello che e' successo quando il nero
     assoluto e' diventato #08080c.

     Due e non uno perche' il `media` segue il tema del sistema: con uno
     solo, la barra resta del colore dell'altro tema e si vede la riga di
     stacco sopra la pagina. -->
<meta name="theme-color" content="#08080c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eceef4" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATLAS">
<!-- Le icone le copia la pubblicazione da `assets/icons/`: una sola
     sorgente per le due app. Il `?v` scavalca la cache delle icone, che non
     guarda gli header. -->
<link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png?v=79">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png?v=79">
<!-- L'iPhone ha la SUA icona, quadrata e piena: la forma la ritaglia iOS, e
     un angolo trasparente sotto la sua maschera diventa nero. Le altre
     icone hanno gli angoli tondi già dentro, per Windows, dove nessuno
     ritaglia niente. -->
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=79">

<!-- Il tema scelto su questo dispositivo, PRIMA del primo disegno: deciderlo
     in main.ts vorrebbe dire un lampo di pagina scura sul tema chiaro. -->
<script>
  try {
    var t = localStorage.getItem("atlas.tema");
    if (t === "chiaro" || t === "scuro") document.documentElement.dataset.tema = t;
  } catch (e) { /* navigazione privata: resta «auto» */ }
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
