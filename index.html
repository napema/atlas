<!DOCTYPE html>
<html lang="it" data-tema="auto">
<head>
<meta charset="utf-8">
<!-- `maximum-scale` e `user-scalable` bloccano lo zoom su Android. Safari li
     ignora di proposito, per accessibilità: lì lo zoom si toglie con
     `touch-action` in base.css e con i `gesture*` in core/app.js. Servono
     tutti e tre insieme, nessuno dei tre basta da solo. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>ATLAS</title>
<meta name="description" content="Finanze, mobilità e abitudini in una sola app.">

<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest">
<!-- Due, una per tema: con una sola, la barra di stato di Safari restava
     del colore dell'altro tema e si vedeva una striscia chiara sopra una
     pagina scura. Sono i `backgroundsGrouped.primary` di iOS 27 — #000 e
     #f2f2f7 — copiati a mano perche' qui le variabili CSS non arrivano. -->
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATLAS">
<!-- UNA SOLA ICONA, SENZA FONDO, ovunque — anche quelle dell'app
     installata, che prima il fondo ce l'avevano.

     Era l'ultimo posto dove restava un quadrato, e su Windows si vedeva:
     nella barra delle applicazioni la piastrella non viene arrotondata da
     nessuna maschera, quindi il marchio arrivava dentro un quadrato bianco
     con gli angoli vivi. Trasparente il problema non esiste, e lo stesso
     file va bene sul tema chiaro e su quello scuro: non c'è più niente da
     scegliere in base al tema.

     Il prezzo: iOS un PNG trasparente sulla schermata Home lo appoggia sul
     nero. Per un marchio blu va bene, ed è il compromesso giusto — il
     quadrato lo vedevi ogni giorno sul PC, il fondo nero su iPhone si nota
     molto meno.

     Il `?v` c'è perché i browser tengono le icone in una cache tutta loro,
     che non guarda gli header: senza, la vecchia resta lì per giorni. -->
<link rel="icon" type="image/png" sizes="1024x1024" href="./assets/icons/icona-1024.png?v=77">
<link rel="icon" type="image/png" sizes="64x64" href="./assets/icons/favicon-64.png?v=77">
<link rel="apple-touch-icon" href="./assets/icons/icona-1024.png?v=77">

<!-- I fogli sono due e in quest'ordine: i token prima, sempre. -->
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/base.css">

<!-- SF Pro e' self-hosted: precaricare i due tagli che si vedono per
     primi evita il lampo di testo di sistema al primo avvio, che su una
     PWA installata si nota parecchio. Gli altri quattro li chiede
     `tokens.css` quando servono. -->
<link rel="preload" href="./assets/fonts/sf-pro-text-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./assets/fonts/sf-pro-display-bold.woff2" as="font" type="font/woff2" crossorigin>

<!-- La configurazione NON è un modulo ES: deve essere già in memoria quando
     core/sync.js viene valutato. Perciò script normale, prima di tutto. -->
<script src="./config.js"></script>
</head>
<body>

<div id="app">
  <main id="vista" role="main">
    <!-- Il router riempie qui. Il vuoto iniziale dura pochi millisecondi:
         niente scheletro finto, che a quella durata dà solo un lampo. -->
  </main>

  <nav id="barra" role="navigation" aria-label="Moduli">
    <!-- costruita da core/app.js a partire da core/registro.js -->
  </nav>
</div>

<noscript>
  <p style="padding:2rem;text-align:center">
    ATLAS ha bisogno di JavaScript: tutto il calcolo avviene nel browser,
    non c'è un server che possa disegnare le pagine al posto suo.
  </p>
</noscript>

<script type="module" src="./core/app.js"></script>
</body>
</html>
