<!DOCTYPE html>
<html lang="it" data-tema="auto">
<head>
<meta charset="utf-8">
<!-- `maximum-scale` e `user-scalable` bloccano lo zoom su Android. Safari li
     ignora di proposito, per accessibilità: lì lo zoom si toglie con
     `touch-action` in base.css e con i `gesture*` in core/app.js. Servono
     tutti e tre insieme, nessuno dei tre basta da solo. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>ATLAS</title>
<meta name="description" content="Finanze, mobilità e abitudini in una sola app.">

<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATLAS">
<!-- L'icona della scheda la sceglie `dipingiIcona()` in core/app.js, che
     legge il tema EFFETTIVO dell'app: qui c'è solo il punto di partenza.
     Il perché sta lì: una SVG con dentro il proprio `prefers-color-scheme`
     Chrome la disegna una volta sola e non la ridisegna mai più, e
     l'attributo `media` sul link non sa niente del tema scelto dentro
     ATLAS. L'`id` è il gancio, non toglierlo. -->
<link rel="icon" id="favicona" type="image/svg+xml" href="./assets/icons/icona-chiara.svg">
<!-- L'icona sulla home dell'iPhone invece è una sola e fissa: iOS non
     guarda né SVG né `media`, e l'icona di un'app installata non cambia
     col tema. Quella è la versione scura, che è l'identità dell'app.
     Il `?v` c'è perché i browser tengono le icone in una cache tutta loro,
     che non guarda gli header: senza, la vecchia resta lì per giorni. -->
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png?v=50">

<!-- I fogli di stile sono due e in quest'ordine: i token prima, sempre. -->
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/base.css">

<!-- I font sono self-hosted: precaricarli evita il lampo di testo di sistema
     al primo avvio, che su una PWA installata si nota parecchio. -->
<link rel="preload" href="./assets/fonts/sf-pro-text-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./assets/fonts/sf-pro-display-bold.woff2" as="font" type="font/woff2" crossorigin>

<!-- La configurazione NON è un modulo ES: deve essere già in memoria quando
     core/sync.js viene valutato. Perciò script normale, prima di tutto. -->
<script src="./config.js"></script>
</head>
<body>

<div id="app">
  <main id="vista" role="main">
    <!-- Il router riempie qui. Il vuoto iniziale dura pochi millisecondi:
         niente scheletro finto, che a quella durata dà solo un lampo. -->
  </main>

  <nav id="barra" role="navigation" aria-label="Moduli">
    <!-- costruita da core/app.js a partire da core/registro.js -->
  </nav>
</div>

<noscript>
  <p style="padding:2rem;text-align:center">
    ATLAS ha bisogno di JavaScript: tutto il calcolo avviene nel browser,
    non c'è un server che possa disegnare le pagine al posto suo.
  </p>
</noscript>

<script type="module" src="./core/app.js"></script>
</body>
</html>
