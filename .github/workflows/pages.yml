# Pubblica ATLAS su GitHub Pages.
#
# La app è in `app/` (Svelte + TypeScript) e si compila qui, a ogni push.
# Va alla radice del sito. La app di prima resta pubblicata sotto, come
# riserva (`/atlas/v1.html`), insieme ai file che le due condividono: la
# logica dei moduli in `moduli/` e i video degli esercizi.
#
# Una compilazione fallita NON lascia il sito vuoto: i passi della app nuova
# hanno `continue-on-error`, e se la build non arriva in fondo resta online
# la app di prima. Un errore di tipo non deve impedire di segnare una spesa.

name: Pubblica su Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un rilascio alla volta; se ne arriva uno nuovo mentre il precedente è in
# corso, il precedente si lascia finire (annullarlo lascerebbe il sito a metà).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.rilascio.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara la cartella da pubblicare
        run: |
          mkdir -p _sito
          rsync -a --exclude '.git' \
                   --exclude '.github' \
                   --exclude 'docs' \
                   --exclude 'legacy' \
                   --exclude 'app' \
                   --exclude 'node_modules' \
                   --exclude '_sito' \
                   ./ _sito/

      # ---------------------------------------------------- la app nuova --
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: v2 · dipendenze
        id: dipendenze
        continue-on-error: true
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: v2 · controllo dei tipi
        # Il controllo parla ma non ferma: gli errori finiscono nel log e
        # nelle annotazioni della corsa, la build prosegue.
        continue-on-error: true
        if: steps.dipendenze.outcome == 'success'
        working-directory: app
        run: npm run controlla

      - name: v2 · compilazione
        id: v2
        continue-on-error: true
        if: steps.dipendenze.outcome == 'success'
        working-directory: app
        run: npm run build

      - name: La app nuova al posto della vecchia
        # La app nuova va alla RADICE, sopra alla vecchia: stessa `index.html`,
        # stesso `sw.js`, stesso manifest. È quello che la fa arrivare sul
        # telefono senza reinstallare niente — il service worker nuovo prende
        # il posto del vecchio nella stessa registrazione, e l'iscrizione alle
        # notifiche, che è legata a quella registrazione, resta valida.
        #
        # La vecchia resta raggiungibile in `v1.html`, come riserva: i suoi
        # file (core/, moduli/, styles/) sono ancora pubblicati, e i video
        # degli esercizi in moduli/mobilita/clip/ li usano tutte e due.
        #
        # Se la compilazione è fallita questo passo non gira, e resta online
        # la app di prima: meglio una versione vecchia che nessuna.
        if: steps.v2.outcome == 'success'
        run: |
          mv _sito/index.html _sito/v1.html
          cp -r app/dist/. _sito/

      - name: v2 · copia da scaricare
        # La stessa build, scaricabile con `gh run download`: serve a
        # guardarla in locale sullo stesso indirizzo della app di prima,
        # cioè con gli stessi dati sul dispositivo.
        if: steps.v2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v2
          path: app/dist
          retention-days: 7

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sito
      - id: rilascio
        uses: actions/deploy-pages@v4
