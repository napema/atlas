# Pubblica ATLAS su GitHub Pages.
#
# Il sito è statico e senza build: si copia la cartella così com'è, tolte
# le parti che servono solo a chi sviluppa. Niente npm, niente bundler —
# è una scelta, non una mancanza: un'app che deve durare anni non deve
# dipendere da una catena di strumenti che invecchia.

name: Pubblica su Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un rilascio alla volta; se ne arriva uno nuovo mentre il precedente è in
# corso, il precedente si lascia finire (annullarlo lascerebbe il sito a metà).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.rilascio.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara la cartella da pubblicare
        run: |
          mkdir -p _sito
          rsync -a --exclude '.git' \
                   --exclude '.github' \
                   --exclude 'docs' \
                   --exclude 'legacy' \
                   --exclude '_sito' \
                   ./ _sito/

      - name: Controlla che il service worker sia stato aggiornato
        # Un guscio nuovo servito con la versione vecchia resta appiccicato
        # sui dispositivi: è l'errore che costa più tempo a capire.
        run: |
          set -e
          if git diff --quiet HEAD~1 HEAD -- sw.js 2>/dev/null; then
            if ! git diff --quiet HEAD~1 HEAD -- index.html core styles moduli 2>/dev/null; then
              echo "::warning file=sw.js::Il guscio è cambiato ma sw.js no: alza VERSIONE."
            fi
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sito
      - id: rilascio
        uses: actions/deploy-pages@v4
