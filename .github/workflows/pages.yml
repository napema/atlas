# Pubblica ATLAS su GitHub Pages.
#
# DUE APP, UN SITO, finché la nuova non ha preso il posto della vecchia:
#
#   /atlas/      la app di prima, statica: si copia così com'è
#   /atlas/v2/   la app nuova (Svelte + TypeScript), compilata qui
#
# La compilazione della nuova NON può fermare la pubblicazione della
# vecchia: quella è la app che si usa ogni giorno, e un errore di tipo in
# una schermata nuova non deve impedire di segnare una spesa. Per questo i
# passi della v2 hanno `continue-on-error` e la copia in `_sito/v2` avviene
# solo se la build è arrivata in fondo.

name: Pubblica su Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un rilascio alla volta; se ne arriva uno nuovo mentre il precedente è in
# corso, il precedente si lascia finire (annullarlo lascerebbe il sito a metà).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.rilascio.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara la cartella da pubblicare
        run: |
          mkdir -p _sito
          rsync -a --exclude '.git' \
                   --exclude '.github' \
                   --exclude 'docs' \
                   --exclude 'legacy' \
                   --exclude 'app' \
                   --exclude 'node_modules' \
                   --exclude '_sito' \
                   ./ _sito/

      # ---------------------------------------------------- la app nuova --
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: v2 · dipendenze
        id: dipendenze
        continue-on-error: true
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: v2 · controllo dei tipi
        # Il controllo parla ma non ferma: gli errori finiscono nel log e
        # nelle annotazioni della corsa, la build prosegue.
        continue-on-error: true
        if: steps.dipendenze.outcome == 'success'
        working-directory: app
        run: npm run controlla

      - name: v2 · compilazione
        id: v2
        continue-on-error: true
        if: steps.dipendenze.outcome == 'success'
        working-directory: app
        run: npm run build

      - name: v2 · nel sito
        if: steps.v2.outcome == 'success'
        run: cp -r app/dist _sito/v2

      - name: v2 · copia da scaricare
        # La stessa build, scaricabile con `gh run download`: serve a
        # guardarla in locale sullo stesso indirizzo della app di prima,
        # cioè con gli stessi dati sul dispositivo.
        if: steps.v2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v2
          path: app/dist
          retention-days: 7

      - name: Controlla che il service worker sia stato aggiornato
        # Un guscio nuovo servito con la versione vecchia resta appiccicato
        # sui dispositivi: è l'errore che costa più tempo a capire.
        run: |
          set -e
          if git diff --quiet HEAD~1 HEAD -- sw.js 2>/dev/null; then
            if ! git diff --quiet HEAD~1 HEAD -- index.html core styles 'moduli/*/modulo.js' 'moduli/*/viste.js' 'moduli/*/*.css' 2>/dev/null; then
              echo "::warning file=sw.js::Il guscio è cambiato ma sw.js no: alza VERSIONE."
            fi
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sito
      - id: rilascio
        uses: actions/deploy-pages@v4
