<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ATLAS">
  <title>ATLAS</title>
  <!-- Nucleo e anello: il guscio e le cose che ci stanno dentro.
       Questa è la versione scura. Il gemello è icona-chiara.svg, e
       a scegliere fra i due è core/app.js — non una media query dentro il
       file: Chrome le SVG in favicon le disegna una volta sola e non le
       ridisegna al cambio di tema, quindi la scelta va fatta fuori. -->
  <rect width="512" height="512" rx="112" fill="#0f0f12"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#3fa9ff" stroke-width="38"/>
  <circle cx="256" cy="256" r="54" fill="#3fa9ff"/>
</svg>
