<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ATLAS">
  <title>ATLAS</title>
  <!--
    Una vetta. Sono le montagne dell'Atlante — il nome viene da lì — ed è la
    prima forma di questa serie che sia una COSA e non una figura
    geometrica: il rombo prima, il cerchio col punto, la A, i tre archi.
    Una cosa si riconosce di sfuggita, una figura geometrica si confonde.

    NIENTE FONDO, MAI. Le versioni con il quadrato dietro su Windows
    diventavano una piastrella — bianca sull'ultima, scura su quella prima —
    perché lì nessuna maschera la ritaglia. Senza fondo il marchio sta su
    qualunque superficie e non c'è un tema da indovinare: il file è uno solo
    e va bene su chiaro e su scuro.

    IL BLU È #2b86f0 per questo: 3,3:1 sul bianco e 5,6:1 sul nero. Per un
    testo il primo non basterebbe, per una forma piena sì — e cercare un
    colore che superi 4,5 su TUTTI E DUE i fondi vuol dire un blu spento che
    non si vede bene da nessuna parte.

    L'inchiostro sta entro 179px dal centro, contro i 205 della zona sicura:
    regge anche un ritaglio circolare.
  -->
  <path d="M118 332 L216 172 L286 278 L324 222 L396 332 Z"
        fill="#2b86f0" stroke="#2b86f0" stroke-width="32" stroke-linejoin="round"/>
</svg>
